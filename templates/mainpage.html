{% extends "layout.html" %}

{% block body %}
<body class="warn-on-unload"></body>

<div class="main-container">
    <div class="left-container">
        <div class="form-container">
            <h3 id="nric-header">Input Client NRIC</h3>
            <form id="nric-form">
                <div class="form-group">
                    <input type="text" id="nric-input" name="nric" placeholder="Enter NRIC">
                    <button type="submit" id="query-btn" onclick="nricQuery(event)">Query</button>
                </div>
                <div id="status-text"></div>
            </form>
        </div>
        
        <div style="padding: 24px;">
            <h2 style="font-size: 30x; color: #6b7280; font-weight: 500; text-align: center; margin: 0; letter-spacing: 0.5px;">Images for illustrative purposes only</h2>
        </div>

        <!-- Item Type Filter -->
        <div style="padding: 16px 24px; background-color: #f9fafb; border-radius: 8px; margin: 0 24px 20px 24px;">
            <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 12px;">Filter by Type</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="type-filter-btn" onclick="filterByType('')" style="padding: 8px 14px; background-color: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s;">All Items</button>
                {% for type in stock_types %}
                <button class="type-filter-btn" onclick="filterByType('{{ type }}')" style="padding: 8px 14px; background-color: #e5e7eb; color: #374151; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s;" data-type="{{ type }}">{{ type }}</button>
                {% endfor %}
            </div>
        </div>
        
        <div class="product-container">
            {% for item in items %}
            <div class="product-card" data-type="{{ item.type }}">
                <img src="{{ url_for('static', filename='images/' ~ item.image) }}" alt="{{ item.name }}" class="product-image">
                <h3 class="product-name">{{ item.name }}</h3>
                <p class="product-type" style="font-size: 12px; color: #9ca3af; margin: 4px 0 8px 0;">{{ item.type }}</p>
                <p class="product-price">{{ item.price }} tokens</p>
                <div class="quantity-controls">
                    <button type="button" class="quantity-decrease">−</button>
                    <span class="product-quantity">0</span>
                    <button type="button" class="quantity-increase">+</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="right-container">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button type="button" id="toggle-cart-btn" class="cart-toggle-btn" aria-expanded="true">Collapse</button>
        </div>
        <div id="client-name">Client Name</div>
        <div id="transaction-log" class="transaction-log"></div>
        <div id="total-counter">Total: </div>
        <button id="checkout-button" type="button" onclick="checkOut()" disabled>Submit Transaction</button>
    </div>
</div>
{% endblock %}
