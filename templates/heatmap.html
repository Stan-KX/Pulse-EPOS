{% extends "layout.html" %}

{% block body %}
<style>
    .heatmap-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .heatmap-header {
        margin-bottom: 30px;
    }

    .heatmap-header h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .controls-section {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
    }

    .textarea-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .textarea-wrapper label {
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 14px;
    }

    #postal-codes {
        width: 100%;
        height: 300px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        resize: vertical;
    }

    .buttons-section {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 10px;
    }

    .btn-action {
        padding: 12px 20px;
        font-size: 14px;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 200px;
    }

    .btn-remove-duplicates {
        background-color: #333;
        color: white;
    }

    .btn-remove-duplicates:hover {
        background-color: #555;
    }

    .btn-generate {
        background-color: #007bff;
        color: white;
    }

    .btn-generate:hover {
        background-color: #0056b3;
    }

    .btn-action:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .status-message {
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
        display: none;
    }

    .status-message.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        display: block;
    }

    .status-message.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block;
    }

    .status-message.info {
        background-color: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
        display: block;
    }

    .map-container {
        margin-top: 30px;
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        display: none;
    }

    .map-container.active {
        display: block;
    }

    #map {
        width: 100%;
        height: 500px;
    }

    .map-info {
        padding: 15px;
        background-color: #f9f9f9;
        border-top: 1px solid #ddd;
    }

    .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .spinner-text {
        display: none;
    }

    .spinner-text.active {
        display: inline;
    }
</style>

<div class="heatmap-container">
    <div class="heatmap-header">
        <h1>Heatmap Generator</h1>
        <p>Generate heat maps from Singapore postal codes</p>
    </div>

    <div id="status-message" class="status-message"></div>

    <div class="controls-section">
        <div class="textarea-wrapper">
            <label for="postal-codes">Postal Codes (one per line)</label>
            <textarea id="postal-codes" placeholder="Enter postal codes here, with each new postal code on a new line.&#10;Example:&#10;123456&#10;234567&#10;345678"></textarea>
        </div>

        <div class="buttons-section">
            <button class="btn-action btn-remove-duplicates" onclick="removeDuplicates()">
                Remove Duplicates
            </button>
            <button class="btn-action btn-generate" onclick="generateHeatmap()">
                Generate Heat Map
            </button>
        </div>
    </div>

    <div id="map-container" class="map-container">
        <div id="map"></div>
        <div class="map-info">
            <span id="map-info-text"></span>
        </div>
    </div>
</div>

<script>
    let mapInstance = null;

    function showStatus(message, type = 'info') {
        const statusElement = document.getElementById('status-message');
        statusElement.textContent = message;
        statusElement.className = `status-message ${type}`;
    }

    function removeDuplicates() {
        const textarea = document.getElementById('postal-codes');
        const postalCodes = textarea.value;

        if (!postalCodes.trim()) {
            showStatus('Please enter postal codes', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('action', 'remove_duplicates');
        formData.append('postal_codes', postalCodes);

        fetch('/heatmap', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                textarea.value = data.postal_codes.join('\n');
                showStatus('Duplicates removed!', 'success');
            } else {
                showStatus(data.message || 'Error removing duplicates', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showStatus('Error removing duplicates', 'error');
        });
    }

    function generateHeatmap() {
        const textarea = document.getElementById('postal-codes');
        const postalCodes = textarea.value;

        if (!postalCodes.trim()) {
            showStatus('Please enter postal codes', 'error');
            return;
        }

        const generateBtn = document.querySelector('.btn-generate');
        generateBtn.disabled = true;
        showStatus('Generating heat map, please wait...', 'info');

        const formData = new FormData();
        formData.append('action', 'generate');
        formData.append('postal_codes', postalCodes);

        fetch('/heatmap', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            generateBtn.disabled = false;

            if (data.success) {
                displayMap(data.map_html, data.points_count, data.errors);
                let message = `Heat map generated with ${data.points_count} points`;
                if (data.errors.length > 0) {
                    message += `. Warnings: ${data.errors.join('; ')}`;
                }
                showStatus(message, 'success');
            } else {
                showStatus(data.message || 'Error generating heat map', 'error');
            }
        })
        .catch(error => {
            generateBtn.disabled = false;
            console.error('Error:', error);
            showStatus('Error generating heat map', 'error');
        });
    }

    function displayMap(mapHtml, pointsCount, errors) {
        const mapContainer = document.getElementById('map-container');
        const mapElement = document.getElementById('map');

        // Replace the map element with the generated HTML
        mapElement.innerHTML = mapHtml;
        mapContainer.classList.add('active');

        // Update info text
        let infoText = `Heat Map with ${pointsCount} location(s)`;
        if (errors.length > 0) {
            infoText += ` (${errors.length} skipped: ${errors.join(', ')})`;
        }
        document.getElementById('map-info-text').textContent = infoText;
    }

    // Clear status message when user starts typing
    document.getElementById('postal-codes').addEventListener('input', function() {
        const status = document.getElementById('status-message');
        if (status.classList.contains('info')) {
            status.className = 'status-message';
        }
    });
</script>

{% endblock %}
